<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideShare - Customer Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>🚗 RideShare Customer</h1>
                <div class="user-info">
                    <span id="user-name">Loading...</span>
                    <button class="btn btn-secondary" onclick="logout()">Logout</button>
                </div>
            </div>
        </header>

        <!-- Login/Register Modal -->
        <div id="auth-modal" class="modal">
            <div class="modal-content">
                <h2 id="modal-title">Customer Login</h2>
                
                <!-- Login Form -->
                <div id="login-form">
                    <form onsubmit="handleLogin(event)">
                        <div class="form-group">
                            <label for="login-email">Email:</label>
                            <input type="email" id="login-email" required>
                        </div>
                        <div class="form-group">
                            <label for="login-password">Password:</label>
                            <input type="password" id="login-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary" id="login-btn">Login</button>
                    </form>
                    <p class="toggle-auth">
                        Don't have an account? 
                        <a href="#" onclick="toggleAuthMode()">Register here</a>
                    </p>
                </div>

                <!-- Register Form -->
                <div id="register-form" style="display: none;">
                    <form onsubmit="handleRegister(event)">
                        <div class="form-group">
                            <label for="reg-name">Full Name:</label>
                            <input type="text" id="reg-name" required>
                        </div>
                        <div class="form-group">
                            <label for="reg-email">Email:</label>
                            <input type="email" id="reg-email" required>
                        </div>
                        <div class="form-group">
                            <label for="reg-password">Password:</label>
                            <input type="password" id="reg-password" required>
                        </div>
                        <div class="form-group">
                            <label for="reg-phone">Phone:</label>
                            <input type="tel" id="reg-phone" required>
                        </div>
                        <button type="submit" class="btn btn-primary" id="register-btn">Register</button>
                    </form>
                    <p class="toggle-auth">
                        Already have an account? 
                        <a href="#" onclick="toggleAuthMode()">Login here</a>
                    </p>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <main id="main-content" style="display: none;">
            <!-- Quick Actions -->
            <section class="quick-actions">
                <h2>Quick Actions</h2>
                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="showBookRideModal()">
                        📍 Book New Ride
                    </button>
                    <button class="btn btn-secondary" onclick="refreshOrders()">
                        🔄 Refresh Orders
                    </button>
                </div>
            </section>

            <!-- Current Orders -->
            <section class="orders-section">
                <h2>My Orders</h2>
                <div id="orders-container">
                    <div class="loading">Loading your orders...</div>
                </div>
            </section>
        </main>

        <!-- Book Ride Modal -->
        <div id="book-ride-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Book a Ride</h2>
                    <button class="close-btn" onclick="closeBookRideModal()">&times;</button>
                </div>
                <form onsubmit="handleBookRide(event)">
                    <div class="form-group">
                        <label for="pickup-location">Pickup Location:</label>
                        <input type="text" id="pickup-location" required placeholder="Enter pickup address">
                    </div>
                    <div class="form-group">
                        <label for="destination">Destination:</label>
                        <input type="text" id="destination" required placeholder="Enter destination address">
                    </div>

                    <div class="form-group">
                        <label for="pickup-coordinates">Pickup Coordinates:</label>
                        <input
                            type="text"
                            id="pickup-coordinates"
                            required
                            placeholder="latitude, longitude"
                            
                        >
                        <button
                            type="button"
                            class="btn btn-secondary"
                            onclick="getCurrentLocation()"
                            style="margin-top: 8px;"
                        >
                            📍 Use My Current Location
                        </button>
                    </div>

                    <div class="form-group">
                        <label for="dropoff-coordinates">Destination Coordinates:</label>
                        <input
                            type="text"
                            id="dropoff-coordinates"
                            required
                            placeholder="latitude, longitude"
                            
                        >
                        <button
                            type="button"
                            class="btn btn-secondary"
                            onclick="getDestinationCoordinates()"
                            style="margin-top: 8px;"
                        >
                            📍 Find Destination Coordinates
                        </button>
                    </div>
                    <div class="form-group">
                        <label for="vehicle-type">Vehicle Type:</label>
                        <select id="vehicle-type" required>
                            <option value="">Select vehicle type</option>
                            <option value="bike">🏍️ Bike</option>
                            <option value="auto">🛺 Auto</option>
                            <option value="car">🚗 Car</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="notes">Special Instructions (Optional):</label>
                        <textarea id="notes" rows="3" placeholder="Any special instructions..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" id="book-ride-btn">Book Ride</button>
                </form>
            </div>
        </div>
    </div>

    <script src="http://localhost:3000/socket.io/socket.io.js"></script>
    <script src="js/auth.js"></script>
    <script>
        let socket = null;

        function connectCustomerSocket() {
            const token = authManager.token;

            if (!token) {
                console.warn('⚠️ No customer authentication token found');
                return;
            }

            socket = io('http://localhost:3000', {
                auth: {
                    token: token
                }
            });

            socket.on('connect', () => {
                console.log('🟢 Customer Socket connected:', socket.id);
            });

            socket.on('order_accepted', (data) => {
                console.log('✅ ORDER ACCEPTED:', data);

                alert(
                    `🎉 Ride Accepted!\n\n` +
                    `Order: ${data.orderId}\n` +
                    `Driver: ${data.driverInfo?.name || 'Driver'}`
                );

                loadOrders();
            });

            socket.on('connect_error', (error) => {
                console.error('❌ Customer Socket connection error:', error.message);
            });

            socket.on('disconnect', (reason) => {
                console.log('🔴 Customer Socket disconnected:', reason);
            });
        }
        let orders = [];
        let autoRefreshInterval = null;

        // Initialize the application
        function initApp() {
            console.log('🚀 Initializing Customer Dashboard');
            
            if (authManager.isAuthenticated()) {
                connectCustomerSocket();
                showDashboard();
                loadUserInfo();
                loadOrders();
                startAutoRefresh();
            } else {
                showAuthModal();
            }
        }

        // Show authentication modal
        function showAuthModal() {
            document.getElementById('auth-modal').style.display = 'block';
            document.getElementById('main-content').style.display = 'none';
        }

        // Show main dashboard
        function showDashboard() {
            document.getElementById('auth-modal').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }

        // Load user information
        function loadUserInfo() {
            const user = authManager.user;
            if (user) {
                document.getElementById('user-name').textContent = user.name;
            }
        }

        // Toggle between login and register forms
        function toggleAuthMode() {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const modalTitle = document.getElementById('modal-title');

            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                modalTitle.textContent = 'Customer Login';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                modalTitle.textContent = 'Customer Registration';
            }
        }

        // Handle login
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            uiUtils.showLoading('login-btn');

            try {
                const result = await authManager.login(email, password);
                
                if (result.success) {
                    if (result.user.userType !== 'customer') {
                        uiUtils.showMessage('Please use the driver portal for driver accounts', 'error');
                        authManager.clearAuth();
                        return;
                    }
                    
                    uiUtils.showMessage('Login successful!', 'success');
                    showDashboard();
                    loadUserInfo();
                    loadOrders();
                    startAutoRefresh();
                } else {
                    uiUtils.showMessage(result.message, 'error');
                }
            } catch (error) {
                uiUtils.showMessage('Login failed', 'error');
            } finally {
                uiUtils.hideLoading('login-btn', 'Login');
            }
        }

        // Handle registration
        async function handleRegister(event) {
            event.preventDefault();
            
            const userData = {
                name: document.getElementById('reg-name').value,
                email: document.getElementById('reg-email').value,
                password: document.getElementById('reg-password').value,
                phone: document.getElementById('reg-phone').value,
                userType: 'customer'
            };

            uiUtils.showLoading('register-btn');

            try {
                const result = await authManager.register(userData);
                
                if (result.success) {
                    uiUtils.showMessage('Registration successful! Please login.', 'success');
                    toggleAuthMode(); // Switch to login form
                } else {
                    uiUtils.showMessage(result.message, 'error');
                }
            } catch (error) {
                uiUtils.showMessage('Registration failed', 'error');
            } finally {
                uiUtils.hideLoading('register-btn', 'Register');
            }
        }

        // Load orders from API
        async function loadOrders() {
            console.log('📋 Loading customer orders');
            
            const result = await authManager.apiCall('/orders');
            
            if (result.success) {
                orders = result.data.orders || [];
                displayOrders();
                console.log(`✅ Loaded ${orders.length} orders`);
            } else if (result.error === 'UNAUTHORIZED') {
                console.warn('⚠️ Unauthorized - showing login modal');
                showAuthModal();
            } else {
                console.error('❌ Failed to load orders:', result.error);
                document.getElementById('orders-container').innerHTML = 
                    '<div class="error">Failed to load orders</div>';
            }
        }

        // Display orders
        function displayOrders() {
            const container = document.getElementById('orders-container');

            if (orders.length === 0) {
                container.innerHTML = '<div class="no-orders">No orders found. Book your first ride!</div>';
                return;
            }

            const ordersHtml = orders.map(order => `
                <div class="order-card ${order.status}">
                    <div class="order-header">
                        <div class="order-id">
                            Order #${order.orderId}
                        </div>

                        <div class="order-status status-${order.status}">
                            ${order.status.toUpperCase()}
                        </div>
                    </div>

                    <div class="order-details">

                        <div class="location">
                            <div class="pickup">
                                📍 ${order.pickupAddress || 'Pickup address unavailable'}
                            </div>

                            <div class="destination">
                                🏁 ${order.dropoffAddress || 'Destination unavailable'}
                            </div>
                        </div>

                        <div class="order-info">
                            <div class="vehicle-type">
                                🚗 ${order.orderType || 'Ride'}
                            </div>

                            <div class="created-at">
                                🕒 ${uiUtils.formatDate(order.createdAt)}
                            </div>

                            ${
                                order.fare?.totalFare !== undefined
                                ? `<div class="price">💰 ₹${Number(order.fare.totalFare).toFixed(2)}</div>`
                                : ''
                            }

                            ${
                                order.estimatedDistance !== undefined
                                ? `<div class="distance">📏 ${Number(order.estimatedDistance).toFixed(2)} km</div>`
                                : ''
                            }

                            ${
                                order.estimatedDuration !== undefined
                                ? `<div class="duration">⏱ ${order.estimatedDuration} min</div>`
                                : ''
                            }
                        </div>

                        ${
                            order.driver
                            ? `
                                <div class="driver-info">
                                    <div class="driver-name">
                                        👨‍💼 Driver assigned
                                    </div>
                                </div>
                            `
                            : ''
                        }

                        ${
                            order.specialInstructions
                            ? `
                                <div class="notes">
                                    📝 ${order.specialInstructions}
                                </div>
                            `
                            : ''
                        }

                    </div>

                    <div class="order-actions">

                        ${
                            order.status === 'pending'
                            ? `
                                <button
                                    class="btn btn-danger btn-sm"
                                    onclick="cancelOrder('${order.orderId}')">
                                    Cancel Order
                                </button>
                            `
                            : ''
                        }

                        <button
                            class="btn btn-secondary btn-sm"
                            onclick="showOrderDetails('${order.orderId}')">
                            View Details
                        </button>

                    </div>
                </div>
            `).join('');

            container.innerHTML = ordersHtml;
        }

        // Show book ride modal
        function showBookRideModal() {
            document.getElementById('book-ride-modal').style.display = 'block';
        }

        // Close book ride modal
        function closeBookRideModal() {
            document.getElementById('book-ride-modal').style.display = 'none';
            // Reset form
            document.querySelector('#book-ride-modal form').reset();
        }

        // Handle book ride
        async function handleBookRide(event) {
            event.preventDefault();

            const pickupCoords = document
                .getElementById('pickup-coordinates')
                .value
                .split(',')
                .map(Number);

            const dropoffCoords = document
                .getElementById('dropoff-coordinates')
                .value
                .split(',')
                .map(Number);

            if (
                pickupCoords.length !== 2 ||
                dropoffCoords.length !== 2 ||
                pickupCoords.some(isNaN) ||
                dropoffCoords.some(isNaN)
            ) {
                uiUtils.showMessage(
                    'Please enter valid coordinates: latitude, longitude',
                    'error'
                );
                return;
            }

            const rideData = {
                pickupAddress: document.getElementById('pickup-location').value,
                pickupLatitude: pickupCoords[0],
                pickupLongitude: pickupCoords[1],

                dropoffAddress: document.getElementById('destination').value,
                dropoffLatitude: dropoffCoords[0],
                dropoffLongitude: dropoffCoords[1],

                orderType: 'ride',

                specialInstructions:
                    document.getElementById('notes').value || undefined
            };
            console.log('🚕 Ride Data Being Sent:', rideData);

            uiUtils.showLoading('book-ride-btn');

            try {
                const result = await authManager.apiCall('/orders', {
                    method: 'POST',
                    body: JSON.stringify(rideData)
                });

                if (result.success) {
                    uiUtils.showMessage('Ride booked successfully!', 'success');
                    closeBookRideModal();
                    loadOrders();
                } else {
                    uiUtils.showMessage(result.error, 'error');
                }
            } catch (error) {
                uiUtils.showMessage('Failed to book ride', 'error');
            } finally {
                uiUtils.hideLoading('book-ride-btn', 'Book Ride');
            }
        }
        // Cancel order
        async function cancelOrder(orderId) {
            if (!confirm('Are you sure you want to cancel this order?')) {
                return;
            }

            const result = await authManager.apiCall(`/orders/${orderId}/cancel`, {
                method: 'PUT',
                body: JSON.stringify({
                    reason: 'Cancelled by customer'
                })
            });

            if (result.success) {
                uiUtils.showMessage('Order cancelled successfully', 'success');
                loadOrders();
            } else {
                uiUtils.showMessage(
                    result.error || result.message || 'Failed to cancel order',
                    'error'
                );
            }
        }

        // Show order details
        function showOrderDetails(orderId) {
            const order = orders.find(o => o.orderId === orderId);

            if (order) {
                alert(
                    `Order Details:\n\n` +
                    `ID: ${order.orderId}\n` +
                    `Status: ${order.status.toUpperCase()}\n` +
                    `From: ${order.pickupAddress || 'N/A'}\n` +
                    `To: ${order.dropoffAddress || 'N/A'}\n` +
                    `Type: ${order.orderType || 'N/A'}\n` +
                    `Distance: ${order.estimatedDistance ?? 'N/A'} km\n` +
                    `Duration: ${order.estimatedDuration ?? 'N/A'} min\n` +
                    `Fare: ₹${order.fare?.totalFare?.toFixed(2) ?? 'N/A'}\n` +
                    `Created: ${new Date(order.createdAt).toLocaleString()}`
                );
            }
        }

        // Refresh orders manually
        function refreshOrders() {
            console.log('🔄 Manual orders refresh');
            loadOrders();
        }

        // Auto refresh orders every 30 seconds
        function startAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
            
            autoRefreshInterval = setInterval(() => {
                if (authManager.isAuthenticated()) {
                    console.log('🔄 Auto-refreshing orders');
                    loadOrders();
                }
            }, 30000); // 30 seconds
        }

        // Stop auto refresh
        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
        }

        // Logout function
        function logout() {
            stopAutoRefresh();
            authManager.logout();
        }

        async function getDestinationCoordinates() {
            const destinationInput = document.getElementById('destination');
            const coordinatesInput = document.getElementById('dropoff-coordinates');

            const destination = destinationInput.value.trim();

            if (!destination) {
                alert('❌ Please enter a destination address first.');
                destinationInput.focus();
                return;
            }

            try {
                coordinatesInput.value = 'Finding location...';

                const response = await fetch(
                    `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(destination)}`
                );

                if (!response.ok) {
                    throw new Error('Geocoding request failed');
                }

                const results = await response.json();

                if (results.length === 0) {
                    coordinatesInput.value = '';
                    alert('❌ Destination location could not be found. Please enter a more specific address.');
                    return;
                }

                const location = results[0];

                const latitude = parseFloat(location.lat);
                const longitude = parseFloat(location.lon);

                coordinatesInput.value = `${latitude}, ${longitude}`;

                console.log('📍 Destination Coordinates:', {
                    address: location.display_name,
                    latitude,
                    longitude
                });

            } catch (error) {
                console.error('❌ Destination geocoding error:', error);

                coordinatesInput.value = '';

                alert('❌ Unable to find the destination location.');
            }
        }

        function getCurrentLocation() {
            if (!navigator.geolocation) {
                alert('❌ Geolocation is not supported by your browser.');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;

                    document.getElementById('pickup-coordinates').value =
                        `${latitude}, ${longitude}`;

                    console.log('📍 Current Location:', {
                        latitude,
                        longitude
                    });
                },
                (error) => {
                    console.error('❌ Location error:', error);

                    switch (error.code) {
                        case error.PERMISSION_DENIED:
                            alert('❌ Location permission was denied. Please allow location access.');
                            break;

                        case error.POSITION_UNAVAILABLE:
                            alert('❌ Location information is unavailable.');
                            break;

                        case error.TIMEOUT:
                            alert('❌ Location request timed out.');
                            break;

                        default:
                            alert('❌ Unable to get your current location.');
                    }
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }
       
        
        // Handle page visibility change to prevent unnecessary API calls when page is hidden
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                console.log('📄 Page hidden - stopping auto refresh');
                stopAutoRefresh();
            } else {
                console.log('📄 Page visible - starting auto refresh');
                if (authManager.isAuthenticated()) {
                    loadOrders(); // Load immediately when page becomes visible
                    startAutoRefresh();
                }
            }
        });

        // Close modals when clicking outside
        window.onclick = function(event) {
            const authModal = document.getElementById('auth-modal');
            const bookRideModal = document.getElementById('book-ride-modal');
            
            if (event.target === authModal) {
                // Don't allow closing auth modal by clicking outside if not authenticated
                if (authManager.isAuthenticated()) {
                    authModal.style.display = 'none';
                }
            }
            
            if (event.target === bookRideModal) {
                closeBookRideModal();
            }
        }

        // Initialize app when page loads
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
